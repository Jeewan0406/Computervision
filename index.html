<!doctype html>
<html lang="en" data-theme="dark" data-accent="druk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>JeeA! — Many AIs. One place.</title>
    <meta name="description" content="JeeA! is a free web app to chat with many AI models in one place. Register free, let Auto pick the right model, get answers from trusted sources with APA citations, compare models, build AI teams and agents, and work with files and images." />
    <meta name="keywords" content="AI chat, free AI, many AI models, compare AI models, AI agents, Llama, Claude, GPT, Gemini, Bhutan" />
    <link rel="canonical" href="https://jeewan0406.github.io/JeeAI-by-Jeewan/" />
    <meta name="theme-color" content="#140d0b" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JeeA!" />
    <meta property="og:url" content="https://jeewan0406.github.io/JeeAI-by-Jeewan/" />
    <meta property="og:title" content="JeeA! — Many AIs. One place." />
    <meta property="og:description" content="Chat with many AI models in one place, for free. Register and start in your browser." />
    <meta property="og:image" content="https://jeewan0406.github.io/JeeAI-by-Jeewan/og-image.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "JeeA!",
        "alternateName": "JeeAI by Jeewan",
        "url": "https://jeewan0406.github.io/JeeAI-by-Jeewan/",
        "description": "A free web app to chat with many AI models in one place: Auto model choice, trusted sources with APA citations, compare, AI teams, agents, files and images.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (web browser)",
        "image": "https://jeewan0406.github.io/JeeAI-by-Jeewan/og-image.png",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var saved = JSON.parse(localStorage.getItem('jeea.settings') || '{}');
        var s = saved.state || {};
        var t = s.theme || 'dark';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        var a = s.accent || 'druk';
        if ((saved.version || 0) < 2 && a === 'violet') a = 'druk';
        document.documentElement.dataset.accent = a;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>JeeA! — Many AIs. One place.</h1>
      <p>A free web app to chat with many AI models in one place. Register free, let Auto pick the right model for each question, get answers from trusted sources with APA citations, compare models side by side, give models roles in a team, run agents, and work with PDF, Word, PowerPoint, Excel files and pictures.</p>
      <p>JeeA! runs in your browser and needs JavaScript. Please turn JavaScript on to use it.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
