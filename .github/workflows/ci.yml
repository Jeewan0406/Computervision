# Type-check, unit tests and production build on every push and pull request.
name: CI

on:
  push:
    branches-ignore: [main, agent-results, news-data]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
