# JeeA! 24/7 agents: runs the tasks in agents/tasks.json on a schedule and
# saves each report to the "agent-results" branch, which the website reads.
# Add API keys under Settings -> Secrets and variables -> Actions (optional).
name: 24/7 Agents

on:
  schedule:
    - cron: '17 * * * *' # every hour at :17 (GitHub is busiest at the top of the hour)
  workflow_dispatch:
    inputs:
      task:
        description: 'Run only this task id (optional)'
        required: false
        default: ''
      force:
        description: 'Run tasks even if they are not due yet'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: jeea-agents
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts

      - name: Get previous results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin agent-results >/dev/null 2>&1; then
            git clone --depth 1 --branch agent-results "$REMOTE" agent-results
          else
            mkdir agent-results && cd agent-results && git init -q -b agent-results && git remote add origin "$REMOTE"
            printf '# JeeA! agent results\n\nWritten by the 24/7 Agents workflow. Do not edit by hand.\n' > README.md
          fi

      - name: Run agents
        env:
          AGENT_OUT: agent-results
          AGENT_TASK: ${{ inputs.task }}
          AGENT_FORCE: ${{ inputs.force }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: node agents/run.mjs

      - name: Save results
        run: |
          cd agent-results
          git config user.name "jeea-agents[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -q -m "Agent results $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:agent-results
